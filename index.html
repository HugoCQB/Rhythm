<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BPM Challenge — Test de Tempo</title>

  <!-- Configuration PWA -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BPM Challenge" />

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230f172a'/%3E%3Ccircle cx='256' cy='256' r='170' fill='none' stroke='%2338bdf8' stroke-width='28'/%3E%3Ctext x='256' y='282' font-family='sans-serif' font-size='110' font-weight='bold' fill='%23f8fafc' text-anchor='middle'%3EBPM%3C/text%3E%3C/svg%3E" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <div class="header-row">
      <h1>BPM Challenge</h1>
      <button id="installBtn" class="btn-install" hidden>📲 Installer</button>
    </div>
    <div class="subtitle">Tapez 12 fois le plus régulièrement possible au tempo indiqué</div>

    <div class="target-box" id="targetBox">
      <div class="target-label">Tempo Cible</div>
      <div class="target-bpm" id="targetDisplay">--</div>
      <div class="target-label">BPM</div>

      <div class="controls-row">
        <button class="btn-small" id="randomBpmBtn">🎲 Nouveau BPM</button>
        <input type="number" id="customBpmInput" min="40" max="240" placeholder="Ex: 95" />
        <button class="btn-small" id="setBpmBtn">Fixer</button>
      </div>
    </div>

    <button class="tap-btn" id="tapBtn">
      TAP
      <span class="tap-hint">(ou Barre d'espace)</span>
    </button>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status-text" id="statusText">Prêt : tapez pour démarrer (0 / 12)</div>

    <div class="results" id="resultsBox">
      <div class="target-label">Précision Globale</div>
      <div class="score-big" id="accuracyScore">98.5%</div>
      <div id="verdictText" class="verdict-text"></div>

      <div class="metrics">
        <div class="metric-card">
          <div class="metric-val" id="userBpmVal">--</div>
          <div class="metric-lbl">Votre BPM</div>
        </div>
        <div class="metric-card">
          <div class="metric-val" id="diffBpmVal">--</div>
          <div class="metric-lbl">Écart</div>
        </div>
        <div class="metric-card">
          <div class="metric-val" id="consistencyVal">--</div>
          <div class="metric-lbl">Constance</div>
        </div>
      </div>

      <div class="target-label bars-label">Régularité de chaque frappe</div>
      <div class="bars-container" id="barsContainer"></div>

      <button class="btn-listen" id="listenBtn">
        🔊 Écouter le vrai tempo (<span id="listenBpmLabel">--</span> BPM)
      </button>

      <div class="action-buttons">
        <button class="btn-secondary" id="replayBtn">Rejouer celui-ci</button>
        <button class="btn-primary" id="nextRoundBtn">Session suivante (Nouveau BPM) ➔</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
